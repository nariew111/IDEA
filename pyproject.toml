[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imputchip-idea"
version = "0.1.0"
description = "IDEA imputation-driven SNP panel design and trait-adaptive genomic prediction."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "IDEA authors"}
]
dependencies = [
  "filelock",
  "lightgbm",
  "numpy",
  "optuna",
  "pandas-plink",
  "pandas<3",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
test = [
  "pytest",
]

[project.urls]
Repository = "https://github.com/nariew111/IDEA"
Documentation = "https://github.com/nariew111/IDEA#readme"
Issues = "https://github.com/nariew111/IDEA/issues"

[project.scripts]
idea-design = "idea.cli:main"
idea-gp = "idea_gp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"idea_gp.legacy" = ["*.R"]
